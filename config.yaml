# ----------------------------------------------------------------------------
# Crypto Quant Trading System — main configuration
#
# This file is tuned for a TINY account (~$30 USDT) on Binance USDT-M Futures
# with 2x leverage. See "Tiny-account playbook" in README.md for the math.
# ----------------------------------------------------------------------------

exchange:
  name: binance
  market_type: futures        # "spot" or "futures"
  quote_asset: USDT
  recv_window_ms: 5000
  leverage: 2                 # MUST be <= risk.max_leverage
  margin_type: ISOLATED       # ISOLATED contains losses to a single position

# Universe of symbols.
# With < $50 of equity, restrict to a single liquid pair to avoid splitting
# the tiny budget across multiple sub-min-notional positions.
universe:
  - BTCUSDT

interval: 15m
warmup_bars: 300
poll_interval_sec: 30

strategy:
  name: ema_crossover
  params:
    fast: 12
    slow: 26
    rsi_period: 14
    rsi_buy_max: 70
    rsi_sell_min: 30

# Risk management.
# Notional caps below are MARGIN caps; effective exposure cap = cap * leverage.
#
# Sizing math (current values, $30 balance, 2x leverage):
#   notional_by_risk = balance * risk_per_trade_pct / stop_loss_pct
#                    = 30 * 0.02 / 0.02 = $30 notional ($15 margin at 2x)
#   max_notional     = max_position_notional * leverage
#                    = 14 * 2 = $28 notional ($14 margin)
#   final notional   = min(notional_by_risk, max_notional) = $28
# That sits comfortably above Binance's ~$20 USDT-M min notional, with a
# 10% buffer on top via execution.min_notional_buffer_pct.
risk:
  max_position_notional: 14.0   # margin per position, in USDT
  max_total_notional: 14.0      # only one position at a time on $30 balance
  max_open_positions: 1
  risk_per_trade_pct: 0.02      # 2% of equity per stop-out (~$0.60 on $30)
  daily_loss_limit: 5.0         # hard kill switch — ~17% of $30 in one day
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  max_leverage: 2

execution:
  order_type: market
  limit_offset_bps: 5
  min_order_spacing_sec: 60
  # Require target notional to be >= MIN_NOTIONAL * (1 + this).
  # Cushion against step-size quantisation pushing us below the minimum.
  min_notional_buffer_pct: 0.10

logging:
  level: INFO
  file: logs/quant.log
