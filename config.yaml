# ----------------------------------------------------------------------------
# Crypto Quant Trading System — main configuration
# ----------------------------------------------------------------------------

exchange:
  name: binance
  # "spot" or "futures" (USDT-M perpetuals).
  market_type: futures
  quote_asset: USDT
  recv_window_ms: 5000
  # Futures-only. Per-symbol leverage applied at startup. Must be <= risk.max_leverage.
  leverage: 3
  # Futures-only. ISOLATED is safer than CROSSED for systematic strategies
  # because losses can't cascade across positions.
  margin_type: ISOLATED

# Universe of symbols to trade.
universe:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

# Bar interval for the strategy. One of: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d
interval: 15m

# How many historical bars to keep in memory per symbol for indicators.
warmup_bars: 300

# How often the live runner re-evaluates strategies (seconds).
poll_interval_sec: 30

strategy:
  name: ema_crossover
  params:
    fast: 12
    slow: 26
    rsi_period: 14
    rsi_buy_max: 70
    rsi_sell_min: 30

# Risk management — hard limits enforced before every order.
# Notional caps below are MARGIN caps; effective exposure cap = cap * leverage.
risk:
  # Max margin (in quote asset) committed to a single position.
  max_position_notional: 50.0
  # Max total margin across all open positions.
  max_total_notional: 150.0
  # Maximum number of concurrent positions.
  max_open_positions: 2
  # Fraction of free balance willing to lose on a single stop-out.
  risk_per_trade_pct: 0.005
  # Halt trading for the day if realised PnL drops below -X (quote asset).
  daily_loss_limit: 25.0
  # Per-trade stop loss / take profit as fraction of entry price.
  stop_loss_pct: 0.015
  take_profit_pct: 0.03
  # HARD CAP on leverage applied. Even if exchange allows 125x, this gates it.
  # Start tiny on live: 2-3x is plenty until you know the strategy is profitable.
  max_leverage: 3

execution:
  # market | limit
  order_type: market
  # For limit orders, offset from last price (positive = more aggressive).
  limit_offset_bps: 5
  # Minimum seconds between orders on the same symbol (anti-flap).
  min_order_spacing_sec: 60

logging:
  level: INFO
  file: logs/quant.log
