# ----------------------------------------------------------------------------
# Crypto Quant Trading System — main configuration
# ----------------------------------------------------------------------------

exchange:
  name: binance
  quote_asset: USDT
  recv_window_ms: 5000

# Universe of symbols to trade.
universe:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT

# Bar interval for the strategy. One of: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d
interval: 15m

# How many historical bars to keep in memory per symbol for indicators.
warmup_bars: 300

# How often the live runner re-evaluates strategies (seconds).
# For interval=15m, 30s polling is plenty.
poll_interval_sec: 30

strategy:
  name: ema_crossover
  params:
    fast: 12
    slow: 26
    # Optional confirmation filter using RSI to avoid chasing.
    rsi_period: 14
    rsi_buy_max: 70   # don't buy if RSI > this
    rsi_sell_min: 30  # don't sell if RSI < this

# Risk management — hard limits enforced before every order.
risk:
  # Maximum notional (in quote asset, e.g. USDT) per single position.
  max_position_notional: 200.0
  # Maximum total notional exposure across all open positions.
  max_total_notional: 1000.0
  # Maximum number of open positions at once.
  max_open_positions: 3
  # Fraction of free balance to risk per trade (used for sizing).
  risk_per_trade_pct: 0.01
  # Stop trading for the day if realised PnL drops below -X (quote asset).
  daily_loss_limit: 50.0
  # Per-trade stop loss / take profit as fraction of entry price.
  stop_loss_pct: 0.02
  take_profit_pct: 0.04

execution:
  # market | limit
  order_type: market
  # For limit orders, offset from last price (positive = more aggressive).
  limit_offset_bps: 5
  # Minimum seconds between orders on the same symbol (anti-flap).
  min_order_spacing_sec: 60

logging:
  level: INFO
  file: logs/quant.log
