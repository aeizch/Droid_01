# ----------------------------------------------------------------------------
# Crypto Quant Trading System — main configuration
#
# Capital comes from Binance dynamically. At session start (and at each UTC
# day roll) the runner queries availableBalance from your futures account and
# uses it as the basis for every notional cap and the daily kill switch.
# Top up the account, restart the bot, and limits scale automatically.
# ----------------------------------------------------------------------------

exchange:
  name: binance
  market_type: futures        # "spot" or "futures"
  quote_asset: USDT
  recv_window_ms: 5000
  leverage: 2                 # MUST be <= risk.max_leverage
  margin_type: ISOLATED       # contains losses to a single position

# Universe of symbols. With small balances, restrict to one liquid pair so
# the entire margin budget can clear the exchange's MIN_NOTIONAL filter.
universe:
  - BTCUSDT

interval: 15m
warmup_bars: 300
poll_interval_sec: 30

strategy:
  name: ema_crossover
  params:
    fast: 12
    slow: 26
    rsi_period: 14
    rsi_buy_max: 70
    rsi_sell_min: 30

# Risk management — every limit is a fraction of starting balance.
#
# Sizing (per signal):
#   risk_capital     = current_free_balance * risk_per_trade_pct
#   notional_by_risk = risk_capital / stop_loss_pct
#   max_notional     = starting_balance * max_position_pct * leverage
#   target_notional  = min(notional_by_risk, max_notional)
#
# Example, $30 starting balance at 2x leverage:
#   max_notional       = 30 * 0.50 * 2  = $30 notional ($15 margin)
#   notional_by_risk   = 30 * 0.02 / 0.02 = $30 notional
#   target_notional    = $30, comfortably above $20 min-notional + 10% buffer.
#
# If you top up to $60: caps double automatically on the next session restart.
risk:
  max_position_pct: 0.50      # one position uses up to 50% of starting balance
  max_total_pct: 0.90         # total margin across all positions, max 90%
  max_open_positions: 1
  risk_per_trade_pct: 0.02    # 2% of free balance per stop-out
  daily_loss_pct: 0.15        # halt for the day at -15% of starting balance
  stop_loss_pct: 0.02
  take_profit_pct: 0.04
  max_leverage: 2

execution:
  order_type: market
  limit_offset_bps: 5
  min_order_spacing_sec: 60
  # Cushion above the exchange's MIN_NOTIONAL filter; protects against
  # step-size quantisation pushing a borderline order under the line.
  min_notional_buffer_pct: 0.10

logging:
  level: INFO
  file: logs/quant.log
